[package]
name = "nova-explorer"
version = "0.1.0"
description = "NovaExplorer: Accessible Windows File Explorer Alternative"
authors = ["NovaExplorer Team"]
edition = "2021"

[lib]
name = "nova_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
trash = "5"
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif", "ico", "tiff"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Graphics_Gdi"
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
